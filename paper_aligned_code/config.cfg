# ==============================================================================
# KONFIGURASI EKSPERIMEN D3QN MOBILE EDGE COMPUTING (MEC)
# Strictly Conforming to Tang & Wong (IEEE TMC 2020 / 2022)
# ==============================================================================

[ENVIRONMENT]
# Jumlah perangkat mobile IoT (M) dan server edge node (N)
num_devices = 20
num_edge_nodes = 5

# Durasi horizon episode dan deadline (Tabel 1 Paper)
num_time_slots = 100
max_deadline = 10
time_slot_duration = 0.1

# Kapasitas komputasi & transmisi (Tabel 1 Paper)
f_device = 2.5
f_edge = 41.8
r_tran = 14.0
comp_density = 0.297
penalty_cost = 20.0

[DRL_AGENT]
# Hiperparameter Jaringan Saraf Tiruan D3QN (Seksi 5, Halaman 9)
learning_rate = 0.001
discount_factor = 0.9
batch_size = 16
replace_threshold = 200
memory_capacity = 500

# Probabilitas eksplorasi acak epsilon (Seksi 5: 1.0 -> 0.01)
epsilon_init = 1.0
epsilon_min = 0.01

# Dimensi neuron tersembunyi
n_lstm = 20
n_l1 = 20

[WORKLOAD]
# Pilihan pola: stationary, sinusoidal, sudden_shift, bursty, markovian
pattern = sinusoidal

# Parameter kedatangan tugas (Tabel 1 Paper)
base_arrival_prob = 0.3
min_size = 2.0
max_size = 5.0
size_step = 0.1
period = 50
seed = 42

[EXPERIMENT]
# Jumlah episode pelatihan
episodes = 50

# Mekanisme adaptasi reset epsilon Tang & Wong (Seksi 5, Halaman 9)
enable_epsilon_reset = false
reset_at_episode = 25

# Jumlah episode evaluasi greedy murni (epsilon = 0.0)
eval_episodes = 15

# Folder penyimpanan metrik dan grafik
output_dir = paper_aligned_code/reports

