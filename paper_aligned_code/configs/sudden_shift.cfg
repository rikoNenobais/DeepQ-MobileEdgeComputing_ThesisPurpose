[ENVIRONMENT]
num_devices = 20
num_edge_nodes = 5
num_time_slots = 100
max_deadline = 10
time_slot_duration = 0.1
f_device = 2.5
f_edge = 41.8
r_tran = 14.0
comp_density = 0.297
penalty_cost = 20.0

[DRL_AGENT]
learning_rate = 0.001
discount_factor = 0.9
batch_size = 16
replace_threshold = 200
memory_capacity = 500
epsilon_init = 1.0
epsilon_min = 0.01
n_lstm = 20
n_l1 = 20

[WORKLOAD]
pattern = sudden_shift
base_arrival_prob = 0.3
min_size = 2.0
max_size = 5.0
size_step = 0.1
period = 50
seed = 42

[EXPERIMENT]
episodes = 50
enable_epsilon_reset = false
reset_at_episode = 25
eval_episodes = 15
output_dir = paper_aligned_code/reports

